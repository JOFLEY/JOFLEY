name: Serpiente de contribuciones

# Dibuja la serpiente que se come los cuadritos del calendario de contribuciones.
# Las imágenes quedan en la rama "output" y el README las muestra desde ahí.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/serpiente.svg?palette=github-light
            dist/serpiente-oscura.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
